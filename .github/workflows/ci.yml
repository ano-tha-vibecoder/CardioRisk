name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cr
          POSTGRES_PASSWORD: cr
          POSTGRES_DB: cardiorisk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://cr:cr@localhost:5432/cardiorisk_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Migrations apply and match the models
        if: matrix.database == 'postgres'
        env:
          FLASK_APP: app
          DATABASE_URL: postgresql://cr:cr@localhost:5432/cardiorisk_test
        run: |
          flask db upgrade
          flask db check
