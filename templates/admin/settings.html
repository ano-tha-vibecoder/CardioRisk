{% extends "base.html" %}
{% block title %}Clinic settings — CardioRisk{% endblock %}
{% block content %}
{% include "admin/_nav.html" %}
<form method="POST" class="card narrow-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card-body">
    <div class="form-group">
      <label for="timezone">Time zone</label>
      <span class="hint" id="timezone-hint">Used to display times. Records are stored in UTC.</span>
      <select id="timezone" name="timezone" aria-describedby="timezone-hint">
        {% for z in zones %}<option value="{{ z }}"{% if z == org.timezone %} selected{% endif %}>{{ z }}</option>{% endfor %}
      </select>
    </div>
    <label class="checkbox">
      <input type="checkbox" name="require_mfa" value="1" {% if org.require_mfa %}checked{% endif %}>
      <span><strong>Require two-factor authentication</strong><br>
      <span class="hint">Users without it are sent to set it up at their next page load, including you.</span></span>
    </label>
  </div>
  <div class="form-actions"><button type="submit" class="btn btn-primary">Save</button></div>
</form>
{% endblock %}
