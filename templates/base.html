<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Heart Disease Risk Predictor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ url_for('landing') }}" class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>CardioRisk</h1>
          <span>Clinical Decision Support</span>
        </div>
      </a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="{{ url_for('landing') }}" class="nav-link{% if request.endpoint == 'landing' %} nav-link--active" aria-current="page{% endif %}">Home</a>
        <a href="{{ url_for('assess') }}" class="nav-link nav-link--cta{% if request.endpoint == 'assess' %} nav-link--active" aria-current="page{% endif %}">Start Assessment</a>
      </nav>
    </div>
  </header>

  <main class="page{% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
