{% extends "base.html" %}
{% block title %}Sign in — CardioRisk{% endblock %}
{% block content %}
<div class="auth-card card">
  <div class="card-header">
    <h3>Sign in</h3>
    <p>Accounts are issued by your clinic's administrator.</p>
  </div>
  <form method="POST" class="card-body" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if expired %}<div class="alert alert-warning" role="status"><div>Your session ended. Please sign in again.</div></div>{% endif %}
    {% if error %}<div class="alert alert-error" role="alert"><div>{{ error }}</div></div>{% endif %}
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required value="{{ email or '' }}" autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
</div>
{% endblock %}
