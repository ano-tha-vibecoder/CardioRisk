{% extends "base.html" %}
{% block title %}Verification code — CardioRisk{% endblock %}
{% block content %}
<div class="auth-card card">
  <div class="card-header">
    <h3>Two-factor verification</h3>
    <p>Enter the 6-digit code from your authenticator app.</p>
  </div>
  <form method="POST" class="card-body" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error %}<div class="alert alert-error" role="alert"><div>{{ error }}</div></div>{% endif %}
    <div class="form-group">
      <label for="code">Code</label>
      <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Verify</button>
  </form>
</div>
{% endblock %}
